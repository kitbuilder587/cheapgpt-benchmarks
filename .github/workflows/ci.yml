name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/export_result.py --check
      - run: uv build
      - name: Verify community bundles
        run: |
          for bundle in community/submissions/*/; do
            [ -d "$bundle" ] || continue
            uv run cheapgpt-benchmarks verify-bundle "$bundle"
          done

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
