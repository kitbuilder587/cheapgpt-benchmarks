[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cheapgpt-benchmarks"
version = "0.1.0.dev0"
description = "Reproducible public benchmarks for CheapGPT models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CheapGPT" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
cheapgpt-benchmarks = "cheapgpt_benchmarks.cli:app"

[project.urls]
Homepage = "https://kitbuilder587.github.io/cheapgpt-benchmarks/"
Repository = "https://github.com/kitbuilder587/cheapgpt-benchmarks"
Issues = "https://github.com/kitbuilder587/cheapgpt-benchmarks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cheapgpt_benchmarks"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "cheapgpt_benchmarks/profiles"
"benchmarks.lock.yaml" = "cheapgpt_benchmarks/benchmarks.lock.yaml"
"schemas" = "cheapgpt_benchmarks/schemas"
"models.yaml" = "cheapgpt_benchmarks/models.yaml"
"references" = "cheapgpt_benchmarks/references"
"quick" = "cheapgpt_benchmarks/quick"
"docker" = "cheapgpt_benchmarks/docker"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=cheapgpt_benchmarks --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/cheapgpt_benchmarks/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cheapgpt_benchmarks"]
